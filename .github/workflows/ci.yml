name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v4
      - run: uv sync
      - run: uv pip install -e .
      - run: uv run ruff check src/ tests/
      - run: uv run ruff format --check src/ tests/

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v4
      - run: uv sync
      - run: uv pip install -e .
      - run: uv run mypy src/drbrain

  security:
    runs-on: ubuntu-latest
    continue-on-error: true  # torch/transformers advisories are unfixable here (ignored below)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v4
      - run: uv sync
      - run: uv pip install -e .
      - run: uv pip install pip-audit
      # Ignored advisories — no fix available on this toolchain (see
      # [tool.uv] constraint-dependencies in pyproject.toml):
      #   torch 2.10.0   PYSEC-2026-139 (no fix released)
      #                  PYSEC-2025-194 (fix is 2.13.0; blocked by CUDA 12.8
      #                                  driver, pinned <2.11)
      #   transformers 4.57.6
      #                  PYSEC-2025-217 (no fix released)
      #                  PYSEC-2026-2288 (fix 5.0.0), PYSEC-2026-2289 (5.3.0),
      #                  PYSEC-2026-2290 (5.5.0) — all fixed only in
      #                  transformers 5.x, a breaking bump that would break
      #                  sentence-transformers 5.6.1
      - run: >-
          uv run pip-audit --desc
          --ignore-vuln PYSEC-2026-139
          --ignore-vuln PYSEC-2025-194
          --ignore-vuln PYSEC-2025-217
          --ignore-vuln PYSEC-2026-2288
          --ignore-vuln PYSEC-2026-2289
          --ignore-vuln PYSEC-2026-2290
          --ignore-vuln CVE-2026-9856

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v4
      - run: uv sync
      - run: uv pip install -e .
      - run: uv run pytest -m "not integration" --timeout=30 -q
