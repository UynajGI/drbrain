[project]
name = "drbrain"
version = "0.1.0a3"
description = "Academic knowledge graph system — symbol-driven research discovery with lightweight vector retrieval"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
authors = [
    { name = "Yuunagi", email = "yuunagi.cn@outlook.com" },
]
keywords = [
    "academic",
    "research",
    "knowledge-graph",
    "literature",
    "citations",
    "papers",
    "symbol-driven",
    "bm25",
    "graph-closure",
    "knowledge-frontier",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Information Analysis",
]

dependencies = [
    "arxiv>=2.0",
    "httpx[socks]>=0.27",
    "litellm>=1.84.0,<1.85",
    "loguru>=0.7.3",
    "networkx>=3.4",
    "pydantic>=2.10",
    "pyalex>=0.21",
    "pymupdf>=1.27.2.3",
    "pymupdf4llm>=0.0.13",
    "pyyaml>=6.0",
    "numpy>=1.26",
    "rank-bm25>=0.2",
    "requests>=2.31",
    "rich>=13.9",
    "scikit-learn>=1.5",
    "typer>=0.15",
    "umap-learn>=0.5",
    "deepxiv-sdk>=0.2.5",
    "sentence-transformers>=5.6.1",
    "modelscope>=1.39.0",
    "llama-index-core>=0.14.23",
    "llama-index-llms-litellm>=0.7.1",
    "llama-index-retrievers-bm25>=0.7.1",
]

[project.optional-dependencies]
office = ["python-docx>=1.1", "python-pptx>=1.0", "openpyxl>=3.1"]
gnn = ["torch>=2.0,<2.11"]
analytics = ["duckdb"]

[project.urls]
Homepage = "https://github.com/UynajGI/DrBrain"
Repository = "https://github.com/UynajGI/DrBrain"
Issues = "https://github.com/UynajGI/DrBrain/issues"

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=7.1.0",
    "pytest-timeout>=0.5",
    "ruff>=0.8",
]

[project.scripts]
drbrain = "drbrain.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/drbrain"]

[tool.hatch.build.targets.wheel.force-include]
"skills" = "drbrain/skills"
"skills-lock.json" = "drbrain/skills-lock.json"

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = [".trellis/"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = [
    "E501",  # line too long (docstrings, SQL, typer args are naturally long)
]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true
ignore_missing_imports = true
no_implicit_optional = true
exclude = ["tests/", ".trellis/", "skills/"]

[[tool.mypy.overrides]]
module = "drbrain.*"
disallow_untyped_defs = false
warn_return_any = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
norecursedirs = ["docs/learn/scholaraio/tests", "research", ".qwen"]
markers = [
    "integration: slow end-to-end tests using real PDFs and API calls",
]

# Driver 570.211.01 supports up to CUDA 12.8: torch>=2.11 PyPI wheels are built
# against cu129/cu130 and cannot initialize CUDA on this host, so pin <2.11.
[tool.uv]
constraint-dependencies = [
    "torch<2.11",
    # Security floors: transitive deps with known CVEs (pip-audit). Bump
    # together with the corresponding entries in .github/workflows/ci.yml if any
    # of these ever becomes un-resolvable.
    "aiohttp>=3.14.3",
    "click>=8.3.3",
    "idna>=3.15",
    "pillow>=12.3.0",
    "python-dotenv>=1.2.2",
    "urllib3>=2.7.0",
]
