[project]
name = "drbrain"
version = "0.1.0a3"
description = "Academic knowledge graph system — symbol-driven research discovery with corpus-scale hybrid retrieval"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
authors = [
    { name = "Yuunagi", email = "yuunagi.cn@outlook.com" },
]
keywords = [
    "academic",
    "research",
    "knowledge-graph",
    "literature",
    "citations",
    "papers",
    "symbol-driven",
    "bm25",
    "graph-closure",
    "knowledge-frontier",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Information Analysis",
]

dependencies = [
    # Minimal CLI, config, storage, and graph surface. Feature profiles below
    # keep PDF/LLM/RAG/web/provider stacks out of a small installation.
    "click>=8.1",
    "loguru>=0.7.3",
    "networkx>=3.4",
    "pydantic>=2.10",
    "pyyaml>=6.0",
    "numpy>=1.26",
    "requests>=2.31",
    "rich>=13.9",
    "typer>=0.15",
]

[project.optional-dependencies]
# Feature profiles. Install one with ``uv sync --extra <name>`` or combine
# profiles, e.g. ``uv sync --extra ingest --extra models --extra rag``.
pdf = ["pdf-inspector>=1.19.0", "pymupdf>=1.27.2.3", "pymupdf4llm>=0.0.13"]
llm = ["openai>=2.54", "tiktoken>=0.12", "pageindex>=0.1.0"]
models = ["sentence-transformers>=5.6.1", "modelscope>=1.39.0"]
rag = [
    "rank-bm25>=0.2",
    "llama-index-core>=0.14.23",
    "llama-index-llms-openai>=0.6.0",
    "llama-index-retrievers-bm25>=0.7.1",
    "zvec>=0.7.0",
]
providers = [
    "arxiv>=2.0",
    "deepxiv-sdk>=0.2.5",
    "httpx[socks]>=0.27",
    "pyalex>=0.21",
]
web = [
    "fastapi>=0.115",
    "jinja2>=3.1",
    "python-multipart>=0.0.20",
    "uvicorn>=0.30",
]
plugins = ["jsonschema>=4.23", "mcp>=2.0.0"]
analytics = ["duckdb", "scikit-learn>=1.5", "umap-learn>=0.5"]
# Unified tree RAG (docs/unified-tree-rag-design.md): vendored RAPTOR
# clustering (UMAP/GMM) plus the PageIndex structure helpers the narrow
# adapters load.  Deliberately does NOT pull the upstream SDK stack
# (openai-agents / litellm / faiss / torch).
tree = [
    "numpy>=1.26",
    "scikit-learn>=1.5",
    "umap-learn>=0.5",
    "tiktoken>=0.12",
    "PyPDF2>=3.0",
    "pypdfium2>=5",
    "python-dotenv>=1.0",
    "regex>=2024.0",
    "sortedcontainers>=2.4",
]
office = ["python-docx>=1.1", "python-pptx>=1.0", "openpyxl>=3.1"]
gnn = ["torch>=2.0,<2.14"]
anydoc = ["firecrawl-anydoc>=0.1", "ocrmypdf>=16"]
# Common complete profiles. Dependencies are repeated intentionally because
# PEP 621 extras cannot portably reference another extra by name.
ingest = [
    "arxiv>=2.0",
    "deepxiv-sdk>=0.2.5",
    "httpx[socks]>=0.27",
    "openai>=2.54",
    "pageindex>=0.1.0",
    "pyalex>=0.21",
    "pdf-inspector>=1.19.0",
    "pymupdf>=1.27.2.3",
    "pymupdf4llm>=0.0.13",
    "tiktoken>=0.12",
]
full = [
    "arxiv>=2.0",
    "deepxiv-sdk>=0.2.5",
    "duckdb",
    "fastapi>=0.115",
    "firecrawl-anydoc>=0.1",
    "httpx[socks]>=0.27",
    "jinja2>=3.1",
    "jsonschema>=4.23",
    "llama-index-core>=0.14.23",
    "llama-index-llms-openai>=0.6.0",
    "llama-index-retrievers-bm25>=0.7.1",
    "mcp>=2.0.0",
    "modelscope>=1.39.0",
    "numpy>=1.26",
    "ocrmypdf>=16",
    "openai>=2.54",
    "openpyxl>=3.1",
    "pageindex>=0.1.0",
    "pdf-inspector>=1.19.0",
    "pyalex>=0.21",
    "pymupdf>=1.27.2.3",
    "pymupdf4llm>=0.0.13",
    "PyPDF2>=3.0",
    "pypdfium2>=5",
    "python-docx>=1.1",
    "python-dotenv>=1.0",
    "python-multipart>=0.0.20",
    "python-pptx>=1.0",
    "rank-bm25>=0.2",
    "regex>=2024.0",
    "scikit-learn>=1.5",
    "sentence-transformers>=5.6.1",
    "sortedcontainers>=2.4",
    "tiktoken>=0.12",
    "torch>=2.0,<2.14",
    "umap-learn>=0.5",
    "uvicorn>=0.30",
    "zvec>=0.7.0",
]

[project.urls]
Homepage = "https://github.com/UynajGI/DrBrain"
Repository = "https://github.com/UynajGI/DrBrain"
Issues = "https://github.com/UynajGI/DrBrain/issues"

[dependency-groups]
dev = [
    "pre-commit>=4.0",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=7.1.0",
    "pytest-timeout>=0.5",
    "ruff>=0.8",
]
materials = [
    "ase>=3.22",
    "gpaw>=24.6",
]

[project.scripts]
drbrain = "drbrain.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/drbrain"]

[tool.hatch.build.targets.wheel.force-include]
"skills" = "drbrain/skills"
"skills-lock.json" = "drbrain/skills-lock.json"
"src/drbrain/concept_graph/prompts/extract_concepts_lean.txt" = "drbrain/concept_graph/prompts/extract_concepts_lean.txt"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = [
    "E501",  # line too long (docstrings, SQL, typer args are naturally long)
]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true
ignore_missing_imports = true
no_implicit_optional = true
exclude = ["tests/", "skills/"]

[[tool.mypy.overrides]]
module = "drbrain.*"
disallow_untyped_defs = false
warn_return_any = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
norecursedirs = ["docs/learn/scholaraio/tests", "research", ".qwen"]
markers = [
    "integration: slow end-to-end tests using real PDFs and API calls",
]

# Driver 570.211.01 supports up to CUDA 12.8: torch>=2.11 PyPI wheels are built
# against cu129/cu130 and cannot initialize CUDA on this host, so pin <2.11.
[tool.uv]
constraint-dependencies = [
    "torch<2.11",
    # Security floors: transitive deps with known CVEs (pip-audit). Bump
    # together with the corresponding entries in .github/workflows/ci.yml if any
    # of these ever becomes un-resolvable.
    "aiohttp>=3.14.3",
    "click>=8.3.3",
    "httpx2>=2.11.0",
    "idna>=3.15",
    "pillow>=12.3.0",
    "python-dotenv>=1.2.2",
    "urllib3>=2.7.0",
]
