# config.yaml — DrBrain base configuration
# Override values in config.local.yaml (gitignored, generated by `drbrain setup`)
# See config.example.yaml for all available options and provider templates.
#
# Use "${ENV_VAR}" syntax to pull values from environment variables.

llm:
  models:
    - provider: openai
      model: gpt-4o
      api_key: "${OPENAI_API_KEY}"
      base_url: null

mineru:
  token: "${MINERU_TOKEN}"
  model: "vlm"
  is_ocr: false
  enable_formula: true
  enable_table: true
  max_pages: 150

db:
  path: "data/drbrain.db"

dirs:
  inbox: "data/spool/inbox"
  pending: "data/spool/pending"
  papers: "data/papers"
  reports: "data/reports"
  cache: "data/cache"
  logs: "data/logs"

api:
  deepxiv_token: "${DEEPXIV_TOKEN}"
  s2_rate_limit: 100
  s2_api_key: "${S2_API_KEY}"
  cache_ttl: 86400
  crossref_email: "${CROSSREF_EMAIL}"
  openalex_token: "${OPENALEX_TOKEN}"

bm25:
  k1: 1.5
  b: 0.75

extract:
  max_concurrent: 10  # parallel LLM calls during concept extraction

queue:
  weak_threshold: 0.7
  auto_accept: 0.9

fetch:
  max_concurrent: 3
  timeout_per_fetch: 60
  user_agent: "DrBrain/0.1"
  fallback_order: ["openalex", "arxiv", "unpaywall", "doi_direct"]
  unpaywall_email: ""
  institutional_proxy: ""
  proxy_type: ""

embed:
  provider: "local"
  model: "Qwen/Qwen3-Embedding-0.6B"
  device: "auto"
  top_k: 10
  source: "modelscope"
  cache_dir: "~/.cache/modelscope/hub/models"
  hf_endpoint: ""
  api_base: ""
  api_key: ""
  batch_size: 64

# ── LlamaIndex RAG ────────────────────────────────────────────────────
# LlamaIndex 集成配置(工单 T1 基础设施)。enabled=false 全局回退旧实现。
# 设计:docs/llamaindex-integration-design.md
llamaindex:
  enabled: true            # false = 相关命令提示开启后退出(T9 起无 legacy 回退)
  llm: "litellm"           # 桥接 drbrain models 列表(T2 填充)
  vector_store: "memory"   # chroma | memory(起步;chromadb 未装前用 memory)
  storage_dir: "data/llamaindex"   # 索引持久化目录
  retrievers: ["bm25", "vector"]    # fusion 腿
  fusion_mode: "reciprocal_rank"    # | relative_score
  rerank: true
  rerank_model: "Qwen/Qwen3-Reranker-0.6B"
  rerank_top_k: 20
  similarity_cutoff: 0.7   # SimilarityPostProcessor 阈值
  max_node_tokens: 4000    # 超长 PageIndex 节点按段落切分(T9;4000 token ≈ 16K chars)
  streaming: true
  eval:
    golden_set: "data/llamaindex/golden.jsonl"
    split: ["dev", "val", "test"]   # 三集防泄露

# ── Autoresearch ─────────────────────────────────────────────────────
# `drbrain autoresearch run "topic"` 读取此区；重复 topic 自动恢复已有 durable run。
autoresearch:
  enabled: false
  run_dir: "workspace/autoresearch"
  plugins_dir: ""
  mcp_servers: []
  n_critics: 3
  max_cycles: 10
  stagnation_cycles: 3
  max_adaptations: 2
  lease_seconds: 900
  require_rag_evidence: false  # true = 已启用 RAG 时无可引用证据即降为 prediction

